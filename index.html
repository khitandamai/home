<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Hosting - GitHub</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #loading {
            position: fixed; width: 100%; height: 100%; background: #ffffff;
            display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        iframe {
            width: 100%; height: 100%; border: none;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
    </div>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbwWEljl8hcIEaAmummpv7oUeJ5CrewxQqSJGsWqAKBSvpvG1AhooEmXNmYon6leZl0/exec" 
        onload="document.getElementById('loading').style.display='none';">
    </iframe>

</body>
</html>
